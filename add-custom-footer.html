<script type="text/javascript" charset="utf-8">
  function add_custom_footer() {
    let title_slide = document.querySelector("section#title-slide");
    let title_slide_footer = title_slide.getAttribute('data-footer');
    let footer = document.querySelector('div.footer p');
    let global_footer_text = footer.innerHTML;

    if (title_slide.classList.contains('present')) {
      footer.innerHTML = title_slide_footer;
    }

    Reveal.on( 'slidechanged' , event => {
        if (event.currentSlide.matches('#title-slide')) {
          footer.innerHTML = title_slide_footer;
        } else {
          footer.innerHTML = global_footer_text;
        }
      });
  };

  // Show the Overleaf logo (styled in custom.scss) in the top-right corner
  // on any slide tagged with {.overleaf-slide}.
  function add_overleaf_logo() {
    let logo = document.createElement('div');
    logo.className = 'overleaf-corner';
    logo.setAttribute('aria-hidden', 'true');
    document.querySelector('.reveal').appendChild(logo);

    const update = (slide) => {
      logo.classList.toggle('visible',
        !!slide && slide.classList.contains('overleaf-slide'));
    };

    update(Reveal.getCurrentSlide());
    Reveal.on('slidechanged', event => update(event.currentSlide));
  };

  window.addEventListener("load", (event) => {
    add_custom_footer();
    add_overleaf_logo();
  });
</script>
